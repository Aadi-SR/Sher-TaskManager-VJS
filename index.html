<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="sheet">
      <header>
        <div class="brand">
          <span class="eyebrow">Daily record</span>
          <h1>Task Ledger</h1>
        </div>
        <button
          id="theme-toggle"
          title="Toggle theme"
          aria-label="Toggle theme"
        >
          🌙
        </button>
      </header>

      <form class="add-form" id="add-form">
        <div class="row1">
          <input
            type="text"
            id="title-input"
            placeholder="Add task title"
            autocomplete="off"
            required
          />
        </div>
        <div class="row2">
          <select id="category-select">
            <option value="work">Work</option>
            <option value="personal" selected>Personal</option>
            <option value="shopping">Shopping</option>
            <option value="other">Other</option>
          </select>
          <select id="priority-select">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="high">High priority</option>
          </select>
          <input type="date" id="date-input" />
          <button type="submit" class="add-btn">Add task</button>
        </div>
      </form>

      <div class="filter-bar">
        <div class="status-tabs" id="status-tabs">
          <button data-status="all" class="active">All</button>
          <button data-status="active">Active</button>
          <button data-status="completed">Completed</button>
        </div>
        <select id="category-filter">
          <option value="all">All categories</option>
          <option value="work">Work</option>
          <option value="personal">Personal</option>
          <option value="shopping">Shopping</option>
          <option value="other">Other</option>
        </select>
      </div>

      <ul class="task-list" id="task-list">

      </ul>

      <div class="list-footer" id="list-footer">

    </div>

    <script src="script.js"></script>
  </body>
</html>
